<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Redonda: Debate Literario</title>
    <!-- Google Fonts: Outfit e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        
        <!-- PANTALLA DE INGRESO (LOGIN RAPIDO SIN CONTRASEÑA) -->
        <div id="login-screen" class="glass-panel active">
            <div class="login-box">
                <div class="icon-header">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <h2>Debate Literario</h2>
                <p>Escribe tu nombre o apodo para unirte a la mesa redonda interactiva.</p>
                <form id="login-form">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username-input" placeholder="Tu nombre..." required minlength="2" maxlength="20" autocomplete="off">
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>Entrar al Debate</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- PANTALLA PRINCIPAL DEL CHAT Y PREGUNTAS -->
        <main id="main-screen" class="glass-panel">
            
            <!-- PANEL DE PREGUNTAS (IZQUIERDA) -->
            <section class="questions-panel">
                <header class="panel-header">
                    <div class="user-profile">
                        <div class="avatar" id="user-avatar">?</div>
                        <div>
                            <span class="welcome-text">Conectado como</span>
                            <h3 id="current-user-name">Usuario</h3>
                        </div>
                    </div>
                    <button id="exit-btn" title="Salir"><i class="fa-solid fa-sign-out-alt"></i></button>
                </header>

                <div class="panel-content">
                    <div class="intro-box">
                        <h2>Mesa Redonda</h2>
                        <p>Haz clic en cualquiera de las preguntas para enviarla directamente al chat como base de discusión.</p>
                    </div>

                    <div class="questions-list">
                        <button class="question-card" data-q-num="1" data-q-text="¿Qué enseñanza deja la lectura?">
                            <span class="q-badge">Pregunta 1</span>
                            <p class="q-text">¿Qué enseñanza deja la lectura?</p>
                            <span class="q-hint"><i class="fa-solid fa-share"></i> Enviar al debate</span>
                        </button>
                        
                        <button class="question-card" data-q-num="2" data-q-text="¿Qué personajes les impactó más?">
                            <span class="q-badge">Pregunta 2</span>
                            <p class="q-text">¿Qué personajes les impactó más y por qué?</p>
                            <span class="q-hint"><i class="fa-solid fa-share"></i> Enviar al debate</span>
                        </button>

                        <button class="question-card" data-q-num="3" data-q-text="¿Cómo se relaciona la obra con la realidad de Latinoamérica?">
                            <span class="q-badge">Pregunta 3</span>
                            <p class="q-text">¿Cómo se relaciona la obra con la realidad de Latinoamérica?</p>
                            <span class="q-hint"><i class="fa-solid fa-share"></i> Enviar al debate</span>
                        </button>

                        <button class="question-card" data-q-num="4" data-q-text="¿Qué significa desvarío en la vida cotidiana?">
                            <span class="q-badge">Pregunta 4</span>
                            <p class="q-text">¿Qué significa el desvarío en nuestra vida cotidiana?</p>
                            <span class="q-hint"><i class="fa-solid fa-share"></i> Enviar al debate</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- PANEL DE CHAT (DERECHA) -->
            <section class="chat-panel">
                <header class="chat-header">
                    <div class="chat-title">
                        <span class="status-indicator"></span>
                        <div>
                            <h2>Sala de Debate</h2>
                            <p id="chat-status">Cargando debate en tiempo real...</p>
                        </div>
                    </div>
                </header>

                <!-- CONTENEDOR DE MENSAJES -->
                <div class="chat-messages" id="chat-messages">
                    <!-- Los mensajes se cargarán dinámicamente aquí -->
                </div>

                <!-- ENTRADA DE TEXTO -->
                <form id="chat-form" class="chat-input-area">
                    <input type="text" id="message-input" placeholder="Escribe un mensaje aquí o pulsa una pregunta a la izquierda..." required autocomplete="off" disabled>
                    <button type="submit" id="send-btn" class="send-button" disabled>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </section>

        </main>
    </div>

    <!-- Script principal de la aplicación -->
    <script type="module" src="script.js"></script>
</body>
</html>
