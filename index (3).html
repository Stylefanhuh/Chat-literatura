<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debate Literario en Vivo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>

<!-- ===================== PANTALLA DE LOGIN ===================== -->
<section id="login-screen" class="screen">
  <div class="login-card glass">
    <div class="login-emblem">
      <i class="fa-solid fa-feather-pointed"></i>
    </div>
    <h1 class="login-title">Debate Literario</h1>
    <p class="login-subtitle" id="auth-subtitle">Entra con tus credenciales de clase para unirte a la conversación</p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-mode="login">Iniciar sesión</button>
      <button type="button" class="auth-tab" data-mode="register">Crear cuenta</button>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="input-group">
        <i class="fa-solid fa-user input-icon"></i>
        <input type="text" id="username" placeholder="Usuario" minlength="2" maxlength="15" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="password" placeholder="Contraseña" minlength="4" required>
      </div>
      <div class="input-group" id="confirm-password-group" hidden>
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="confirm-password" placeholder="Confirma tu contraseña" minlength="4">
      </div>

      <p id="login-error" class="login-error" hidden>
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Usuario o contraseña incorrectos</span>
      </p>

      <button type="submit" class="btn-primary" id="auth-submit-btn">
        <span>Entrar al debate</span>
        <i class="fa-solid fa-arrow-right-long"></i>
      </button>
    </form>
  </div>
</section>

<!-- ===================== PANTALLA PRINCIPAL DEL CHAT ===================== -->
<section id="chat-screen" class="screen" hidden>

  <header class="topbar glass">
    <div class="topbar-left">
      <i class="fa-solid fa-feather-pointed topbar-logo"></i>
      <span class="topbar-title">Debate Literario</span>
    </div>

    <div class="topbar-right">
      <div class="connection-status">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Conectando…</span>
      </div>
      <div class="user-chip">
        <i class="fa-solid fa-circle-user"></i>
        <span id="current-user-name">—</span>
        <span id="admin-badge" class="admin-badge" hidden>Admin</span>
      </div>
      <button id="logout-btn" class="btn-icon" title="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <div class="main-layout">

    <!-- PANEL IZQUIERDO: preguntas de debate -->
    <aside class="panel-questions glass">
      <h2 class="panel-title">
        <i class="fa-solid fa-circle-question"></i>
        Preguntas guía
      </h2>
      <p class="panel-hint">Haz clic en una pregunta para lanzarla al chat</p>

      <div class="question-list">
        <button class="question-card" data-question="¿Qué enseñanza deja la lectura?">
          <span class="question-number">01</span>
          <span class="question-text">¿Qué enseñanza deja la lectura?</span>
        </button>

        <button class="question-card" data-question="¿Qué personajes les impactó más y por qué?">
          <span class="question-number">02</span>
          <span class="question-text">¿Qué personajes les impactó más y por qué?</span>
        </button>

        <button class="question-card" data-question="¿Cómo se relaciona la obra con la realidad de Latinoamérica?">
          <span class="question-number">03</span>
          <span class="question-text">¿Cómo se relaciona la obra con la realidad de Latinoamérica?</span>
        </button>

        <button class="question-card" data-question="¿Qué significa el desvarío en nuestra vida cotidiana?">
          <span class="question-number">04</span>
          <span class="question-text">¿Qué significa el desvarío en nuestra vida cotidiana?</span>
        </button>
      </div>
    </aside>

    <!-- PANEL DERECHO: chat -->
    <main class="panel-chat glass">
      <div id="messages" class="messages-list">
        <!-- Los mensajes se inyectan dinámicamente -->
      </div>

      <form id="message-form" class="message-form">
        <input type="text" id="message-input" placeholder="Escribe tu aporte al debate…" maxlength="500" autocomplete="off" required>
        <button type="submit" class="btn-send" title="Enviar">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </main>

  </div>
</section>

<!-- ===================== FIREBASE SDK (compat v10.9.0) ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
